<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="signup.css">
    <title>Sign up</title>
</head>

<!-- Button to open the modal -->
<button onclick="document.getElementById('id01').style.display='block'">Sign Up</button>

<!-- The Modal (contains the Sign Up form) -->
<div id="id01" class="modal">
  <form id="signupForm" class="modal-content" method="POST" action="/sign_up_process">
    <div class="container">
      <h1>Sign Up</h1>
      <p>fill ts in already.</p>
      <hr>
      <label for="email"><b>Email</b></label>
      <input id="email" type="text" placeholder="Enter Email" name="email" required>

      <label for="username"><b>Username</b></label>
      <input id="username" type="text" placeholder="Enter Username" name="username" required>

      <label for="psw"><b>Password</b></label>
      <input id="psw" type="password" placeholder="Enter Password" name="psw" required>

      <label for="psw2"><b>Password but again</b></label>
      <input id="psw2" type="password" placeholder="Confirm Password" name="psw2" required>

      <label>
        <input type="checkbox" checked="checked" names="remember" style="margin-bottom:15px"> tick me (please)
      </label>

      <div class="clearfix">
        <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
        <button type="submit" class="signupbtn">Sign Up</button>
      </div>
    </div>
  </form>
</div>

<script src="signup.js" type="module"></script>
